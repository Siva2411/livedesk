spring:
  application:
    name: livedesk-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres-local}
  jackson:
    default-property-inclusion: non-null
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
app:
  jwt:
    secret: ${JWT_SECRET:bGl2ZWRlc2stbG9jYWwtZGV2LXNlY3JldC1jaGFuZ2UtbWUtMzItYnl0ZXM=}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081}
  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,https://*.cloudfront.net}
