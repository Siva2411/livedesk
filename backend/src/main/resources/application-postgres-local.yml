spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/livedesk}
    username: ${DB_USERNAME:livedesk_user}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false
logging:
  level:
    com.livedesk: INFO
