services:
  backend:
    build:
      context: ./backend
    container_name: livedesk-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      DB_URL: ${DB_URL:?Set DB_URL to your private Amazon RDS PostgreSQL endpoint}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set a unique base64 JWT secret}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-720}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set your HTTPS app origin}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:?Set your HTTPS app origin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Workspace Administrator}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    container_name: livedesk-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
